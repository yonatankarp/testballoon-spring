name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: yonatankarp/github-actions/.github/workflows/ci.yml@v2
    with:
      jvm-version: '25'
      coverage-xml: '**/build/reports/kover/report.xml'
      coverage-line-target: '95'
      coverage-branch-target: '90'
