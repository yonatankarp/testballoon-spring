name: Publish

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Build and publish
        # On a release, publish that version; on a main push, publish a SNAPSHOT.
        # RELEASE_TAG is passed via env (never interpolated into the command) to avoid injection.
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_RELEASE: ${{ github.event_name == 'release' }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            ./gradlew build ":lib:publish" "-PreleaseVersion=${RELEASE_TAG}"
          else
            ./gradlew build ":lib:publish"
          fi
